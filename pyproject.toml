[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E701",   # multiple statements on one line (colon) — used in compact score tables
    "E702",   # multiple statements on one line (semicolon) — used in compact score tables
    "SIM108", # ternary operator (readability preference)
    "RUF002", # ambiguous unicode in docstrings (en-dash, multiplication sign are intentional)
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF012", # mutable class-level defaults (used intentionally in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SIM115", # open() without context manager — fine for one-liner reads in tests
    "SIM117", # nested with statements — more readable for mock stacking in tests
]

[tool.ruff.lint.isort]
known-first-party = ["core", "dashboard", "importers"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests", "tests/fixtures"]
skips = ["B101"]  # allow assert in non-test code (used in CLI guards)
